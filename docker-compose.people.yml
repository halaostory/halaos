# HalaPeople — Warp-style payroll, compliance & HR for Southeast Asia.
# Same images as HalaOS, deployed as a separate product: its own compose
# project (database, volumes, network), APP_EDITION=people (only HalaPeople
# modules are routed; other modules return 404 and their jobs do not run).
#
#   docker compose -f docker-compose.people.yml --env-file .env.people up -d --build
#
# Put a TLS reverse proxy in front of PEOPLE_HTTP_PORT (default 8081) for your
# HalaPeople domain. Generated from docker-compose.deploy.yml; keep in sync.
name: halapeople
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-halaos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PEOPLE_POSTGRES_DB:-halapeople}
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-halaos}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - internal
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
    - redisdata:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - internal
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    command:
    - /bin/migrate
    - -cmd
    - up
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-halaos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PEOPLE_POSTGRES_DB:-halapeople}
      POSTGRES_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET}
      MIGRATIONS_DIR: /migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - internal
  api:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    restart: unless-stopped
    command:
    - /bin/api
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: '8080'
      GIN_MODE: release
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-halaos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PEOPLE_POSTGRES_DB:-halapeople}
      POSTGRES_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: ${PEOPLE_CORS_ORIGINS:-https://halapeople.com}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      AI_ENABLED: ${AI_ENABLED:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      BOT_ENABLED: ${BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-HalaOS <noreply@halaos.com>}
      APP_BASE_URL: ${PEOPLE_BASE_URL:-https://halapeople.com}
      APP_EDITION: people
      PRODUCT_NAME: ${PRODUCT_NAME:-HalaPeople}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
    - uploads:/data/uploads
    - private:/data/private
    networks:
    - internal
    expose:
    - '8080'
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - -O
      - /dev/null
      - http://localhost:8080/health
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
  worker:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    restart: unless-stopped
    command:
    - /bin/worker
    volumes:
    - private:/data/private
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-halaos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PEOPLE_POSTGRES_DB:-halapeople}
      POSTGRES_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AI_ENABLED: ${AI_ENABLED:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-HalaOS <noreply@halaos.com>}
      APP_BASE_URL: ${PEOPLE_BASE_URL:-https://halapeople.com}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_EDITION: people
      PRODUCT_NAME: ${PRODUCT_NAME:-HalaPeople}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - internal
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
        reservations:
          memory: 64M
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prebuilt
    restart: unless-stopped
    ports:
    - ${PEOPLE_HTTP_PORT:-8081}:80
    depends_on:
      api:
        condition: service_healthy
    networks:
    - internal
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:80
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M
volumes:
  pgdata: null
  redisdata: null
  uploads: null
  private: null
networks:
  internal:
    driver: bridge
